name: Build Making Windows x64 core
on:
  push:
    branches: [doreena-pc-windows]
    paths:
      - 'windows-kernel/**'
      - '.github/workflows/making-windows-core.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-core:
    runs-on: windows-latest
    steps:
      - name: Checkout Doreena bridge
        uses: actions/checkout@v4
      - name: Checkout latest Making source
        uses: actions/checkout@v4
        with:
          repository: Cheems-gta/Cheems-Core
          ref: making-latest
          path: making-src
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: making-src/native/quic/go.mod
          cache: false
      - name: Install Windows bridge into Making module
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force making-src/native/quic/cmd/doreena-making | Out-Null
          Copy-Item windows-kernel/main.go making-src/native/quic/cmd/doreena-making/main.go
      - name: Download Go modules
        shell: pwsh
        working-directory: making-src/native/quic
        run: |
          go mod download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows amd64 binary
        shell: pwsh
        working-directory: making-src/native/quic
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags="-s -w" -o "$env:GITHUB_WORKSPACE/doreena-making.exe" ./cmd/doreena-making
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "$env:GITHUB_WORKSPACE/doreena-making.exe")) { throw "Missing EXE" }
      - name: Record build provenance and checksum
        shell: pwsh
        run: |
          $sourceCommit = (git -C making-src rev-parse HEAD).Trim()
          "Making source branch: making-latest" | Set-Content -Encoding utf8 BUILD-INFO.txt
          "Making source commit: $sourceCommit" | Add-Content -Encoding utf8 BUILD-INFO.txt
          "Doreena branch commit: $env:GITHUB_SHA" | Add-Content -Encoding utf8 BUILD-INFO.txt
          $hash = (Get-FileHash -Algorithm SHA256 ./doreena-making.exe).Hash.ToLower()
          "$hash  doreena-making.exe" | Set-Content -Encoding utf8 SHA256SUMS.txt
      - name: Smoke-test executable
        shell: pwsh
        run: |
          & ./doreena-making.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Making-Windows-x64-core
          path: |
            doreena-making.exe
            BUILD-INFO.txt
            SHA256SUMS.txt
          if-no-files-found: error
      - name: Verify native code after packaging
        shell: pwsh
        working-directory: making-src/native/quic
        run: |
          go test ./... -count=1 -timeout=120s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
