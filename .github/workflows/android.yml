name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Fetch pinned Mihomo source
        run: |
          git clone --depth 1 --branch v1.19.34 https://github.com/MetaCubeX/mihomo.git mihomo-src
          test "$(git -C mihomo-src rev-parse HEAD)" = "0455d0d28c4526937380505153e65a843d8612e8"
      - name: Cache native library
        id: native-cache
        uses: actions/cache@v4
        with:
          path: app/libs/core.aar
          key: mihomo-v1.19.34-go126-ndk27-gvisor-cmfa-${{ hashFiles('native/**') == '0c9230cd6d5c8791ec71dcb156c7da3d93f4e7c13f9ec656e75a830f880f4b7f' && 'feec5ff4a4fac350be60fdb65018161bb5cc9448616878637c087c1b8a36c5cc' || hashFiles('native/**') }}
      - name: Install NDK
        if: steps.native-cache.outputs.cache-hit != 'true' 
        run: sdkmanager "ndk;27.2.12479018"
      - name: Build Mihomo Android library
        if: steps.native-cache.outputs.cache-hit != 'true' 
        working-directory: native
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
        run: |
          go get -tool golang.org/x/mobile/cmd/gobind@19777044486779222400e9ca16c4306f9c6dbfa9
          go mod tidy
          go install golang.org/x/mobile/cmd/gomobile@19777044486779222400e9ca16c4306f9c6dbfa9
          go install golang.org/x/mobile/cmd/gobind@19777044486779222400e9ca16c4306f9c6dbfa9
          go test -tags with_gvisor,cmfa ./...
          mkdir -p ../app/libs
          gomobile bind -tags with_gvisor,cmfa -target=android/arm64,android/amd64 -androidapi 26 -o ../app/libs/core.aar .
      - name: Save native library cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/libs/core.aar
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Build debug APK
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace --no-daemon
      - name: Verify APK exists and is nonempty
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -n 2
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep libgojni.so
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cheems-Clash-v0.2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Enable KVM for Android test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android VPN lifecycle smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            mkdir -p /tmp/cheems-probe
            echo CHEEMS_TUN_OK > /tmp/cheems-probe/health.txt
            python3 -m http.server 8765 --directory /tmp/cheems-probe > /tmp/cheems-http.log 2>&1 &
            adb push scripts/probe.sh /data/local/tmp/cheems-probe.sh
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell appops set com.cheems.clash ACTIVATE_VPN allow
            adb shell pm grant com.cheems.clash android.permission.POST_NOTIFICATIONS
            adb shell am start -n com.cheems.clash/.MainActivity
            adb shell am instrument -w com.cheems.clash.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation.txt
            grep -q 'OK (1 test)' instrumentation.txt
      - name: Publish single rolling beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="cheems-beta"
          apk="app/build/outputs/apk/debug/app-debug.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
            gh release edit "$tag" --title "Cheems Clash Beta (Latest)" --notes "Latest successfully tested Android beta APK. Build: ${GITHUB_RUN_NUMBER}; commit: ${GITHUB_SHA}. Mihomo v1.19.34. Beta; use your own configuration." --prerelease
          else
            gh release create "$tag" "$apk" \
              --title "Cheems Clash Beta (Latest)" \
              --notes "Latest successfully tested Android beta APK. Build: ${GITHUB_RUN_NUMBER}; commit: ${GITHUB_SHA}. Mihomo v1.19.34. Beta; use your own configuration." \
              --prerelease --target "$GITHUB_SHA"
          fi
