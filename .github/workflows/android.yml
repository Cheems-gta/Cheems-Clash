name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Fetch pinned Mihomo source
        run: |
          git clone --depth 1 --branch v1.19.34 https://github.com/MetaCubeX/mihomo.git mihomo-src
          test "$(git -C mihomo-src rev-parse HEAD)" = "0455d0d28c4526937380505153e65a843d8612e8"
      - name: Install NDK
        run: sdkmanager "ndk;27.2.12479018"
      - name: Build Mihomo Android library
        working-directory: native
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
        run: |
          go get golang.org/x/mobile@19777044486779222400e9ca16c4306f9c6dbfa9
          go mod tidy
          go install golang.org/x/mobile/cmd/gomobile@19777044486779222400e9ca16c4306f9c6dbfa9
          go install golang.org/x/mobile/cmd/gobind@19777044486779222400e9ca16c4306f9c6dbfa9
          go test ./...
          mkdir -p ../app/libs
          gomobile bind -target=android/arm64,android/amd64 -androidapi 26 -o ../app/libs/core.aar .
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Verify APK exists and is nonempty
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -n 2
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep libgojni.so
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cheems-Clash-v0.2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v0.2-beta-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" app/build/outputs/apk/debug/app-debug.apk \
            --title "Cheems Clash v0.2 Beta #${GITHUB_RUN_NUMBER}" \
            --notes "Mihomo v1.19.34 integration: VPN, YAML and HTTPS subscription import, selectors and traffic. arm64 and x86_64. Beta; use your own configuration." \
            --prerelease \
            --target "$GITHUB_SHA"
