name: Android APK
on:
  push:
    branches: [main, cheems-core-native]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Fetch pinned standalone Cheems Core source
        run: |
          git clone --depth 1 --branch transport-preview https://github.com/Cheems-gta/Cheems-Core.git cheems-core-src
          git -C cheems-core-src fetch --depth 1 origin 148b1034255a4a097695baf6c173c1f545a51ae1
          git -C cheems-core-src checkout --detach 148b1034255a4a097695baf6c173c1f545a51ae1
          test "$(git -C cheems-core-src rev-parse HEAD)" = "148b1034255a4a097695baf6c173c1f545a51ae1"
      - name: Import Cheems Core Android source and notices
        run: |
          mkdir -p app/src/main/java app/src/main/assets/licenses
          cp -r cheems-core-src/app/src/main/java/win app/src/main/java/
          rm app/src/main/java/win/cheems/core/MainActivity.java
          rm app/src/main/java/win/cheems/core/TlsChoiceDialog.java
          sed -i 's/MainActivity.class/com.cheems.clash.MainActivity.class/g' app/src/main/java/win/cheems/core/CoreService.java
          sed -i 's/android.R.drawable.stat_sys_upload_done/com.cheems.clash.R.drawable.ic_notification/g' app/src/main/java/win/cheems/core/CoreService.java
          sed -i 's/Cheems Core · VPN/Cheems Clash · VPN/g' app/src/main/java/win/cheems/core/CoreService.java
          cp cheems-core-src/COPYING app/src/main/assets/licenses/GPL-3.0.txt
          cp cheems-core-src/THIRD_PARTY_NOTICES.md app/src/main/assets/licenses/
      - name: Install Go mobile tooling and Android NDK
        run: |
          sdkmanager "ndk;27.2.12479018"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Verify standalone native transport
        working-directory: cheems-core-src/native/quic
        run: |
          go get -tool golang.org/x/mobile/cmd/gobind@latest
          go mod tidy
          go mod verify
          go test ./... -count=1 -timeout=90s
          go vet ./...
      - name: Build Cheems Core Android AAR (no Mihomo)
        working-directory: cheems-core-src/native/quic
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          gomobile init
          gomobile bind -ldflags='-extldflags=-Wl,-z,max-page-size=16384,-z,common-page-size=16384' -target=android/arm,android/arm64 -javapkg go -androidapi 28 -o cheems-quic.aar ./mobilebridge
          mkdir -p ../../../app/libs
          cp cheems-quic.aar ../../../app/libs/cheems-quic.aar
          unzip -p ../../../app/libs/cheems-quic.aar classes.jar > /tmp/cheems-bindings.jar
          jar tf /tmp/cheems-bindings.jar | grep -Fx 'go/mobilebridge/Mobilebridge.class'
          jar tf /tmp/cheems-bindings.jar | grep -Fx 'go/mobilebridge/Network.class'
          ! grep -R 'github.com/metacubex/mihomo' -n ../../../app/src/main/java
      - name: Build debug APK
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace --no-daemon
      - name: Verify APK exists and is nonempty
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -n 2
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep libgojni.so
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cheems-Clash-Native-Core-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Enable KVM for Android test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android VPN lifecycle smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            mkdir -p /tmp/cheems-probe
            echo CHEEMS_TUN_OK > /tmp/cheems-probe/health.txt
            python3 -m http.server 8765 --directory /tmp/cheems-probe > /tmp/cheems-http.log 2>&1 &
            adb push scripts/probe.sh /data/local/tmp/cheems-probe.sh
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell appops set com.cheems.clash ACTIVATE_VPN allow
            adb shell pm grant com.cheems.clash android.permission.POST_NOTIFICATIONS
            adb shell am start -n com.cheems.clash/.MainActivity
            adb shell am instrument -w com.cheems.clash.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation.txt
            grep -q 'OK (1 test)' instrumentation.txt
      - name: Publish single rolling beta release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="cheems-beta"
          apk="app/build/outputs/apk/debug/app-debug.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
            gh release edit "$tag" --title "Cheems Clash Beta (Latest)" --notes "Latest successfully tested Android beta APK. Build: ${GITHUB_RUN_NUMBER}; commit: ${GITHUB_SHA}. Native Cheems Core beta without Mihomo." --prerelease
          else
            gh release create "$tag" "$apk" \
              --title "Cheems Clash Beta (Latest)" \
              --notes "Latest successfully tested Android beta APK. Build: ${GITHUB_RUN_NUMBER}; commit: ${GITHUB_SHA}. Native Cheems Core beta without Mihomo." \
              --prerelease --target "$GITHUB_SHA"
          fi

      - name: Publish isolated Cheems Core integration preview
        if: github.ref == 'refs/heads/cheems-core-native'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="cheems-core-preview"
          apk="app/build/outputs/apk/debug/app-debug.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
            gh release edit "$tag" --title "Cheems Clash · Cheems Core Preview" --notes "Native Cheems Core (no Mihomo). Build: ${GITHUB_RUN_NUMBER}; commit: ${GITHUB_SHA}. Experimental integration; node selection requires reconnect; no independent latency test or Mihomo routing groups." --prerelease
          else
            gh release create "$tag" "$apk" --title "Cheems Clash · Cheems Core Preview" --notes "Native Cheems Core (no Mihomo). Build: ${GITHUB_RUN_NUMBER}; commit: ${GITHUB_SHA}. Experimental integration; node selection requires reconnect; no independent latency test or Mihomo routing groups." --prerelease --target "$GITHUB_SHA"
          fi
