name: Build Cheems Clash with independent Cheems Core
on:
  push:
    branches: [core-integration, main, doreena-stable-icon-only, 'fix/making-timeout-crash', 'fix/making-disconnect-responsive', 'fix/cheems-disconnect-off-main-20261117']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Cheems Clash frontend
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install NDK and Android platform
        run: sdkmanager "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Cache preview signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: cheems-clash-core-preview-debug-signing-v1
      - name: Prepare persistent preview debug key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Cheems Clash Preview,O=Cheems,C=US"
          fi
      - name: Fetch pinned Cheems Core implementation (no Mihomo)
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/Cheems-gta/Cheems-Core.git core-upstream
          git -C core-upstream fetch --depth 1 origin 148b1034255a4a097695baf6c173c1f545a51ae1
          git -C core-upstream checkout --detach 148b1034255a4a097695baf6c173c1f545a51ae1
          test "$(git -C core-upstream rev-parse HEAD)" = "148b1034255a4a097695baf6c173c1f545a51ae1"
          mkdir -p app/src/main/java
          cp -a core-upstream/app/src/main/java/win app/src/main/java/
          rm -f app/src/main/java/win/cheems/core/MainActivity.java
          python3 integration/patch_making_timeout.py
          sed -i 's/new Intent(this, MainActivity.class)/new Intent(this, com.cheems.clash.MainActivity.class)/g' app/src/main/java/win/cheems/core/CoreService.java
          # Cosmetic-only notification branding; leave native VPN implementation untouched.
          sed -i 's/android.R.drawable.stat_sys_upload_done/getResources().getIdentifier("ic_notification", "drawable", getPackageName())/g' app/src/main/java/win/cheems/core/CoreService.java
          sed -i 's/Cheems Core · VPN/Doreena · Making/g; s/Cheems Core VPN/Doreena VPN/g' app/src/main/java/win/cheems/core/CoreService.java
          mkdir -p app/src/main/assets/licenses
          cp core-upstream/COPYING app/src/main/assets/licenses/Cheems-Core-GPL-3.0.txt
          cp core-upstream/THIRD_PARTY_NOTICES.md app/src/main/assets/licenses/THIRD_PARTY_NOTICES.md
          test ! -e app/src/main/java/com/cheems/clash/ClashVpnService.kt
          ! grep -R -E '^import core\\.Core|^import core\\.Protector|metacubex/mihomo' app/src/main/java app/build.gradle.kts
      - name: Run native core tests
        working-directory: core-upstream/native/quic
        run: |
          go mod verify
          go test ./... -count=1 -timeout=90s
          go vet ./...
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build independent native engine
        working-directory: core-upstream/native/quic
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          go get -tool golang.org/x/mobile/cmd/gobind@latest
          go mod tidy
          gomobile init
          gomobile bind -ldflags='-extldflags=-Wl,-z,max-page-size=16384,-z,common-page-size=16384' -target=android/arm,android/arm64 -javapkg go -androidapi 28 -o cheems-quic.aar ./mobilebridge
          mkdir -p ../../../app/libs
          cp cheems-quic.aar ../../../app/libs/cheems-quic.aar
      - name: Verify native bridge and build APK
        run: |
          test -s app/libs/cheems-quic.aar
          unzip -p app/libs/cheems-quic.aar classes.jar > /tmp/cheems-mobilebridge.jar
          javap -classpath /tmp/cheems-mobilebridge.jar go.mobilebridge.Mobilebridge > /tmp/api.txt
          grep -q "startTunnel" /tmp/api.txt
          grep -q "startWithNetwork" /tmp/api.txt
          gradle :app:assembleDebug --stacktrace --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -F "lib/arm64-v8a/libgojni.so"
          unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -F "lib/armeabi-v7a/libgojni.so"
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload independently built Cheems Clash APK
        uses: actions/upload-artifact@v4
        with:
          name: Cheems-Clash-Cheems-Core-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish separately tagged Cheems Core preview release
        if: github.ref == 'refs/heads/core-integration' || github.ref == 'refs/heads/doreena-stable-icon-only'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Doreena-stable-icons.apk
          tag="doreena-stable-icons-${GITHUB_SHA:0:8}"
          apk="dist/Doreena-stable-icons.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
            gh release edit "$tag" --title "Doreena stable-base cosmetic preview" \
              --notes "Native Cheems Core integration, no Mihomo. CI passed for commit ${GITHUB_SHA}. Cosmetic-only changes based on cheems-core-preview; TLS verification remains bypassed and server impersonation risk remains. Real-device VPN stability not independently verified." \
              --prerelease
          else
            gh release create "$tag" "$apk" \
              --target "$GITHUB_SHA" --prerelease \
              --title "Doreena stable-base cosmetic preview" \
              --notes "Native Cheems Core integration, no Mihomo. CI passed for commit ${GITHUB_SHA}. TLS certificate verification bypass enabled by requested compatibility policy; server impersonation risk. Live VPN connectivity requires device testing."
          fi
