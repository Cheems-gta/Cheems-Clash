name: Cheems Core APK
on:
  push:
    branches: [main, cheems-core-only]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify strict TLS policy is not bypassed
        run: python3 scripts/check_tls_policy.py
      - name: Build and test pinned Core native engine
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          git clone https://github.com/Cheems-gta/Cheems-Core.git core-source
          git -C core-source checkout 148b1034255a4a097695baf6c173c1f545a51ae1
          go install golang.org/x/mobile/cmd/gomobile@19777044486779222400e9ca16c4306f9c6dbfa9
          go install golang.org/x/mobile/cmd/gobind@19777044486779222400e9ca16c4306f9c6dbfa9
          export PATH="$(go env GOPATH)/bin:$PATH"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          mkdir -p app/libs
          cd core-source/native/quic
          go get -tool golang.org/x/mobile/cmd/gobind@19777044486779222400e9ca16c4306f9c6dbfa9
          go mod tidy
          go test -race ./... -timeout=180s
          go vet ./...
          gomobile init
          gomobile bind -ldflags='-extldflags=-Wl,-z,max-page-size=16384,-z,common-page-size=16384' -target=android/arm64,android/amd64 -javapkg go -androidapi 28 -o ../../../app/libs/cheems-quic.aar ./mobilebridge
      - name: Include dependency licenses and reject old engine modules
        run: python3 scripts/package_notices.py
      - name: Build APK and run Java regression tests
        run: gradle :engine:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --stacktrace --no-daemon
      - name: Audit APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk
          python3 scripts/verify_apk.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Android TUN and lifecycle test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            python3 scripts/test_socks.py > /tmp/cheems-socks.log 2>&1 &
            adb push scripts/probe.sh /data/local/tmp/cheems-probe.sh
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell appops set com.cheems.clash ACTIVATE_VPN allow
            adb shell pm grant com.cheems.clash android.permission.POST_NOTIFICATIONS
            adb shell am start -n com.cheems.clash/.MainActivity
            adb shell am instrument -w com.cheems.clash.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation.txt
            grep -q 'OK (1 test)' instrumentation.txt
      - name: Prepare tested APK and corresponding source
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Cheems-Clash-v0.3.0-Core-only.apk
          (cd core-source/native/quic && go mod vendor)
          tar --exclude=.git --exclude=.gradle --exclude=dist --exclude='*/build' --exclude='*.aar' --exclude='*.apk' -czf dist/Cheems-Clash-v0.3.0-Core-only-source.tar.gz .
          cd dist
          sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Cheems-Clash-Core-only-tested
          path: dist/*
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Core-check-reports
          path: |
            engine/build/reports/tests/
            app/build/reports/
            instrumentation.txt
